appId: com.lector.app
productName: Lector
copyright: ''

directories:
  output: dist
  buildResources: build

# Lista explicita: sin ella se empaquetarian tambien las pruebas, los fixtures y
# las 267 dependencias de desarrollo del empaquetador.
# electron-builder mete siempre las dependencias de produccion enteras, asi que
# lo util aqui son las exclusiones: un patron de inclusion no las recorta.
files:
  - electron/**/*
  - src/**/*
  - package.json
  # Los .map solo sirven para depurar y pesan mas que el propio codigo.
  - '!**/*.map'
  # Canvas nativo de Skia: entra como dependencia de pdf.js para usarlo desde
  # Node. Aqui pdf.js corre en el navegador y no se toca. Son 20MB de nada.
  - '!node_modules/@napi-rs/**'
  # De pdf.js solo hacen falta el motor, el worker y los recursos de texto.
  - '!node_modules/pdfjs-dist/{legacy,web,types,image_decoders,iccs}/**'
  - '!node_modules/pdfjs-dist/build/*.min.mjs'
  - '!node_modules/pdfjs-dist/build/pdf.sandbox.mjs'
  - '!node_modules/pdfjs-dist/*.md'
  # El OCR local: los idiomas van en vendor/ y el motor como dependencia. Del
  # paquete npm sobran los fuentes y el bundle UMD (se usa el ESM).
  - vendor/**/*
  - '!node_modules/tesseract.js/{src,scripts,docs,examples,benchmarks}/**'
  - '!node_modules/tesseract.js/dist/tesseract.min.js'
  # Del nucleo WASM, solo las variantes LSTM: con OEM 1 (src/ocr/engine.js) el
  # worker compone siempre "…-lstm.wasm.js" (importScripts en worker.min.js),
  # asi que las clasicas no se cargan nunca: ~24 MB fuera del paquete. Los
  # *-lstm se quedan enteros: el .wasm.js es justo el fichero que importa.
  - '!node_modules/tesseract.js-core/tesseract-core.*'
  - '!node_modules/tesseract.js-core/tesseract-core-simd.*'
  - '!node_modules/tesseract.js-core/tesseract-core-relaxedsimd.*'
  # El modelo de layout NO se empaqueta todavia: el ONNX disponible es AGPL y
  # esta aplicacion es MIT. La integracion se enciende sola cuando el modelo
  # esta presente; sin el, las heuristicas mandan como siempre.
  - '!vendor/layout/**'
  - '!node_modules/onnxruntime-web/**'

# La interfaz es solo en espanol: los ~100 locales de Chromium eran 47 MB de
# paquete. en-US se queda porque es el de reserva de Chromium.
electronLanguages:
  - es
  - en-US

win:
  target: portable
  artifactName: Lector.exe

portable:
  # Un unico ejecutable, sin instalacion ni accesos directos.
  artifactName: Lector.exe
  requestExecutionLevel: user
