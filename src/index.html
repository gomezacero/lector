<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- 'wasm-unsafe-eval' es para el modelo de layout (onnxruntime compila su
       WASM en el documento); no habilita eval de JavaScript. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self';">
  <title>Lector</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/themes.css">
  <link rel="stylesheet" href="/src/styles/reader.css">
</head>
<body data-view="library">

  <!-- Biblioteca -->
  <section class="view view-library" id="view-library">
    <header class="library-head">
      <h1>Tu biblioteca</h1>
      <button class="btn btn-primary" id="btn-open">Abrir un PDF</button>
    </header>
    <div class="library-grid" id="library-grid"></div>
    <p class="library-empty" id="library-empty" hidden>
      Todavía no hay libros. Abre un PDF para empezar.
    </p>
  </section>

  <!-- Ficha del libro: se inserta desde bookSheet.js -->

  <!-- Lector -->
  <section class="view view-reader" id="view-reader" aria-label="Lector">
    <div class="stage" id="stage" tabindex="0">
      <!-- Dos capas con contenido identico: al compartir layout se alinean solas.
           El blur vive en la capa (alta como la pantalla), no en el texto completo. -->
      <div class="page-layer page-layer-dim" id="layer-dim" aria-hidden="true">
        <div class="page-content" id="content-dim"></div>
      </div>
      <div class="page-layer page-layer-sharp" id="layer-sharp">
        <div class="page-content" id="content-sharp"></div>
      </div>
    </div>

    <nav class="hud" id="hud" aria-label="Controles de lectura">
      <div class="hud-group hud-group-location">
        <button class="hud-btn hud-library" id="hud-library" title="Volver a la biblioteca (Ctrl+L)">
          <span class="hud-glyph" aria-hidden="true">‹</span><span class="hud-label">Biblioteca</span>
        </button>
        <button class="hud-chapter" id="hud-chapter" title="Índice de capítulos"
                aria-haspopup="menu" aria-expanded="false"></button>
        <span class="hud-ocr" id="hud-ocr" hidden></span>
        <span class="hud-location-meta" aria-label="Posición de lectura">
          <span class="hud-page" id="hud-page" hidden></span>
          <span class="hud-progress" id="hud-progress"></span>
          <span class="hud-eta" id="hud-eta" hidden title="Para terminar el capítulo, a tu ritmo"></span>
          <button class="hud-rhythm" id="hud-rhythm" hidden type="button"
                  title="Pausar la guía de ritmo" aria-label="Pausar la guía de ritmo">Ritmo</button>
        </span>
      </div>

      <div class="hud-group hud-group-navigation">
        <button class="hud-btn" id="hud-back" title="Volver a donde estabas (Alt+←)" hidden>
          <span class="hud-glyph" aria-hidden="true">←</span><span class="hud-label">Volver</span>
        </button>
        <button class="hud-btn hud-mode" id="hud-mode" title="Cambiar de vista (V)">Flujo</button>
      </div>

      <div class="hud-group hud-group-tools" aria-label="Herramientas">
        <button class="hud-btn" id="hud-search" title="Buscar en el libro (Ctrl+F)" aria-pressed="false">Buscar</button>
        <button class="hud-btn" id="hud-dictionary" title="Diccionario offline">Diccionario</button>
        <span class="hud-speech-controls">
          <button class="hud-btn hud-step" id="hud-speech-prev" title="Frase anterior" hidden aria-label="Frase anterior">‹</button>
          <button class="hud-btn" id="hud-speech" title="Escuchar con una voz local">Escuchar</button>
          <button class="hud-btn hud-step" id="hud-speech-next" title="Frase siguiente" hidden aria-label="Frase siguiente">›</button>
        </span>
        <span class="hud-divider" aria-hidden="true"></span>
        <button class="hud-btn" id="hud-bookmark" title="Marcar esta línea (M)" aria-pressed="false">Marcar</button>
        <button class="hud-btn" id="hud-notes" title="Notas (Ctrl+B)" aria-pressed="false">Notas</button>
        <button class="hud-btn hud-settings" id="hud-settings" title="Ajustes (Ctrl+,)" aria-pressed="false">Ajustes</button>
      </div>
    </nav>

    <!-- El indice de capitulos se despliega sobre el HUD -->
    <div class="chapter-menu" id="chapter-menu" hidden role="menu" aria-label="Capítulos"></div>
  </section>

  <!-- Estado de carga. aria-live: sin el, el progreso y los avisos no existen
       para un lector de pantalla. -->
  <div class="loading" id="loading" hidden role="status" aria-live="polite">
    <div class="loading-inner">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">Procesando el libro…</p>
    </div>
  </div>

  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
