<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Como la CSP de la aplicacion mas 'wasm-unsafe-eval': onnxruntime
       compila su WASM en el documento, no en un worker como Tesseract. Si el
       modelo entra en la aplicacion, index.html necesitara lo mismo. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self';">
  <title>Layout (desarrollo)</title>
</head>
<body>
  <script type="module" src="/src/dev/layout.js"></script>
</body>
</html>
